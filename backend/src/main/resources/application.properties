# Application
quarkus.application.name=recipebook-backend
quarkus.http.port=8080

# Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:recipebook_user}
quarkus.datasource.password=${POSTGRES_PASSWORD:recipebook_secret}
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:recipebook}

# Hibernate
quarkus.hibernate-orm.database.generation=validate

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
quarkus.flyway.baseline-description=Pre-Flyway baseline

# CORS - Allow frontend to call API
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=location,info
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# JWT Configuration
mp.jwt.verify.issuer=recipebook
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.lifespan=86400
jwt.duration.hours=24

# Security - permit GraphQL endpoint (auth enforced per-method with @Authenticated)
quarkus.http.auth.permission.public.paths=/graphql,/graphql/*,/q/graphql-ui,/q/graphql-ui/*,/api/images/*,/api/auth/*
quarkus.http.auth.permission.public.policy=permit

# Show error messages for custom exceptions (not hidden as "System error")
mp.graphql.showErrorMessage=com.recipebook.exception.RecipeBookException,org.eclipse.microprofile.graphql.GraphQLException

# Mailer
quarkus.mailer.from=${MAILER_FROM:noreply@recipebook.local}
quarkus.mailer.host=${MAILER_HOST:localhost}
quarkus.mailer.port=${MAILER_PORT:1025}
quarkus.mailer.username=${MAILER_USERNAME:}
quarkus.mailer.password=${MAILER_PASSWORD:}
quarkus.mailer.start-tls=DISABLED
quarkus.mailer.mock=${MAILER_MOCK:true}

# Password reset
password.reset.base-url=${PASSWORD_RESET_BASE_URL:http://localhost:8081/reset-password}
password.reset.expiry-minutes=15

# OAuth (optional — leave env vars unset to disable)
oauth.google.client-id=${OAUTH_GOOGLE_CLIENT_ID:}
oauth.google.client-secret=${OAUTH_GOOGLE_CLIENT_SECRET:}
oauth.google.redirect-uri=${OAUTH_GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/callback/google}
oauth.github.client-id=${OAUTH_GITHUB_CLIENT_ID:}
oauth.github.client-secret=${OAUTH_GITHUB_CLIENT_SECRET:}
oauth.github.redirect-uri=${OAUTH_GITHUB_REDIRECT_URI:http://localhost:8080/api/auth/callback/github}
oauth.frontend.url=${OAUTH_FRONTEND_URL:http://localhost:8081}

# Image upload
app.upload.dir=./uploads/images
quarkus.http.limits.max-body-size=10M

# Admin seed password (override in production)
recipebook.admin.password=${ADMIN_PASSWORD:admin123}

# ============================================================
# DEV profile (%dev)
# ============================================================
%dev.quarkus.datasource.jdbc.min-size=2
%dev.quarkus.datasource.jdbc.max-size=10
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.log.level=INFO
%dev.quarkus.log.category."com.recipebook".level=DEBUG
%dev.quarkus.http.access-log.enabled=true
%dev.quarkus.smallrye-graphql.ui.always-include=true

# ============================================================
# PROD profile (%prod)
# ============================================================
%prod.quarkus.datasource.jdbc.min-size=5
%prod.quarkus.datasource.jdbc.max-size=20
%prod.quarkus.datasource.jdbc.idle-removal-interval=5M
%prod.quarkus.hibernate-orm.log.sql=false
%prod.quarkus.log.level=WARN
%prod.quarkus.log.category."com.recipebook".level=INFO
%prod.quarkus.http.access-log.enabled=true
%prod.quarkus.smallrye-graphql.ui.always-include=false

# ============================================================
# TEST profile (%test) — Quarkus Dev Services auto-starts PostgreSQL
# ============================================================
%test.quarkus.datasource.jdbc.min-size=2
%test.quarkus.datasource.jdbc.max-size=5
%test.quarkus.hibernate-orm.log.sql=false
%test.quarkus.log.level=WARN
%test.quarkus.log.category."com.recipebook".level=INFO
