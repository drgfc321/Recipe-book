version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: recipebook-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recipebook}
      POSTGRES_USER: ${POSTGRES_USER:-recipebook_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recipebook_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recipebook_user} -d ${POSTGRES_DB:-recipebook}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recipebook-backend-prod
    environment:
      QUARKUS_PROFILE: prod
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-recipebook}
      POSTGRES_USER: ${POSTGRES_USER:-recipebook_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recipebook_secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GOOGLE_REDIRECT_URI: ${OAUTH_GOOGLE_REDIRECT_URI:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_GITHUB_REDIRECT_URI: ${OAUTH_GITHUB_REDIRECT_URI:-}
      OAUTH_FRONTEND_URL: ${OAUTH_FRONTEND_URL:-}
    volumes:
      - uploads:/deployments/uploads/images
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recipebook-frontend-prod
    environment:
      BACKEND_URL: http://backend:8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: recipebook-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

  db-backup:
    image: postgres:16-alpine
    container_name: recipebook-db-backup
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-recipebook_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-recipebook_secret}
      PGDATABASE: ${POSTGRES_DB:-recipebook}
    volumes:
      - db_backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "chmod +x /backup.sh && echo '0 3 * * * /backup.sh >> /var/log/backup.log 2>&1' | crontab - && crond -f -l 2"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
  db_backups:
