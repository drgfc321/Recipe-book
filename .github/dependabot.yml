version: 2
updates:
  # Backend — Maven (Quarkus)
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      quarkus:
        patterns:
          - "io.quarkus*"
          - "io.smallrye*"

  # Frontend — Maven (Vaadin + Spring Boot)
  - package-ecosystem: "maven"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      vaadin:
        patterns:
          - "com.vaadin*"
      spring-boot:
        patterns:
          - "org.springframework*"

  # Docker
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
